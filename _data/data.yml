experiences:
  title: Experience
  info:
  - role: Software Engineer
    time: Oct 2024 - Present
    company: SAP, São Leopoldo, RS (Hybrid)
    details: |
      - Develop and maintain Java and Spring Boot backend applications and REST APIs, with complementary React and JSP development.
      - Collaborate with globally distributed teams on software development, technical discussions, and delivery.
      - Diagnosed bottlenecks and implemented API performance improvements by investigating the flow across browser, backend, and database layers while preserving backward compatibility for existing consumers.
      - Investigated customer-specific production failures, implemented defensive fixes, and improved error handling and diagnostic logging.
      - Developed and shared a modular internal Python CLI to simplify repetitive development tasks and improve access to shared engineering knowledge.
      - Contribute to automated testing, code reviews, and AI-assisted development using repository context, documentation, diagnostic logs, reusable skills, and structured validation.
      - Contributed backend development and deployment to an award-winning team project at SAP InnoWeeks 2025.
  - role: Back-end Developer
    time: Oct 2021 - Oct 2024
    company: Verzel Soluções em Sistemas, Remote
    details: |
      - Designed and maintained Java microservices with Spring Boot, applying SOLID principles, design patterns, and clean code practices.
      - Implemented event-driven integrations for real-time processing and data synchronization using Apache Kafka, Kafka Streams, KSQL, and Kafka Connect.
      - Implemented unit and integration tests and contributed to application monitoring and observability using Zipkin and AWS CloudWatch.
      - Worked with AWS services, including Lambda, SQS, EC2, and S3, and contributed to CI/CD pipelines and infrastructure configuration using GitHub Actions, Terraform, and CloudFormation.
      - Worked with relational databases, including PostgreSQL and SQL Server, as well as MongoDB, and contributed to containerized environments using Docker and Kubernetes.
      - Contributed to Node.js applications using Express.js and NestJS and collaborated in teams using Scrum and Kanban.
  - role: SysAdmin
    time: Aug 2018 - Aug 2021
    company: Marinha do Brasil (Brazil's Navy), Florianópolis, SC
    details: |
      - Managed data center operations and maintained physical and virtual servers using VMware, XenServer, and FreeNAS.
      - Administered Linux environments, domain services, DNS, Samba 4, and Drupal-based web applications.
      - Maintained backup, monitoring, and storage routines using tools including Bacula and Zabbix.
      - Taught basic computing classes to EAMSC students.
  - role: Systems Division Assistant
    time: Dec 2012 - Jan 2018
    company: Marinha do Brasil (Brazil's Navy), Niterói, RJ
    details: |
      - Supported data center operations, including server provisioning and maintenance, virtualization, backups, and monitoring.
      - Administered domain and DNS services, Samba 4, and Drupal-based web applications in Linux environments.
      - Worked with VMware ESX, FreeNAS, Bacula, Zabbix, PostgreSQL, MySQL, and shell scripting.
  - role: Support Analyst I
    time: Feb 2012 - Jul 2012
    company: Santa Casa de Juiz de Fora, MG
    details: |
      - Supported billing systems for health plan clients, preparing requests in Oracle Database (PL/SQL).
      - Provided technical support to users and performed computer maintenance.
