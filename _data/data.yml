career-profile:
  title: About Me
  summary: |
    I'm a Software Engineer with 5+ years of backend development experience, focused on Java, Spring Boot, REST APIs, and distributed systems. I collaborate with globally distributed teams, contributing from solution design through implementation and delivery.

    My experience includes backend services, event-driven integrations, API performance improvements, and production troubleshooting. I develop and maintain backend applications, contribute to automated testing and code reviews, and build internal tools in Python to support everyday engineering work.

    My earlier background in Linux and infrastructure helps me investigate issues across application code, databases, and infrastructure. I contribute across the full stack, using React and JSP for frontend development while keeping backend engineering as my primary focus.

    I use AI-assisted workflows to investigate code, evaluate technical approaches, plan implementations, and support automated testing. I combine repository context, reusable skills, and MCP integrations with code review and behavioral validation.
