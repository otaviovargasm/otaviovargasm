career-profile:
  title: Sobre mim
  summary: |
    Sou Software Engineer com mais de cinco anos de experiência em desenvolvimento backend, com foco em Java, Spring Boot, APIs REST e sistemas distribuídos. Colaboro com equipes distribuídas globalmente, contribuindo desde o desenho da solução até a implementação e entrega.

    Minha experiência inclui serviços backend, integrações orientadas a eventos, melhorias de performance de APIs e diagnóstico de problemas em produção. Desenvolvo e mantenho aplicações backend, contribuo com testes automatizados e revisões de código e construo ferramentas internas em Python para apoiar o trabalho diário de engenharia.

    Minha experiência anterior em Linux e infraestrutura me ajuda a investigar problemas entre código, bancos de dados e infraestrutura. Também contribuo em toda a stack, usando React e JSP no frontend, mantendo engenharia backend como foco principal.

    Uso fluxos assistidos por IA para investigar código, avaliar abordagens técnicas, planejar implementações e apoiar testes automatizados. Combino contexto de repositório, skills reutilizáveis e integrações MCP com revisão de código e validação comportamental.
