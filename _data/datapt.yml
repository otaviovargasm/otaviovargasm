experiences:
  title: Experiências
  info:
  - role: Software Engineer
    time: Out 2024 - Atualmente
    company: SAP, São Leopoldo, RS (Híbrido)
    details: |
      - Desenvolvimento e manutenção de aplicações backend e APIs REST com Java e Spring Boot, com atuação complementar em React e JSP.
      - Colaboração com equipes distribuídas globalmente em desenvolvimento, discussões técnicas e entrega de software.
      - Diagnóstico de gargalos e implementação de melhorias de performance em APIs, investigando o fluxo entre navegador, backend e banco de dados e preservando compatibilidade com consumidores existentes.
      - Investigação de falhas específicas de clientes em produção, implementação de correções defensivas e melhoria do tratamento de erros e dos logs de diagnóstico.
      - Desenvolvimento e compartilhamento de uma CLI interna modular em Python para simplificar tarefas repetitivas e melhorar o acesso ao conhecimento compartilhado de engenharia.
      - Contribuição com testes automatizados, revisões de código e desenvolvimento assistido por IA usando contexto de repositório, documentação, logs, skills reutilizáveis e validação estruturada.
      - Contribuição em backend e deploy para um projeto de equipe premiado no SAP InnoWeeks 2025.
  - role: Desenvolvedor Back-end
    time: Out 2021 - Out 2024
    company: Verzel Soluções em Sistemas, Remoto
    details: |
      - Projeto e manutenção de microsserviços Java com Spring Boot, aplicando princípios SOLID, padrões de projeto e práticas de clean code.
      - Implementação de integrações orientadas a eventos para processamento em tempo real e sincronização de dados com Apache Kafka, Kafka Streams, KSQL e Kafka Connect.
      - Implementação de testes unitários e de integração e contribuição para monitoramento e observabilidade com Zipkin e AWS CloudWatch.
      - Trabalho com AWS Lambda, SQS, EC2 e S3 e contribuição para pipelines CI/CD e configuração de infraestrutura usando GitHub Actions, Terraform e CloudFormation.
      - Trabalho com PostgreSQL, SQL Server e MongoDB e contribuição em ambientes conteinerizados com Docker e Kubernetes.
      - Contribuição em aplicações Node.js com Express.js e NestJS e colaboração em equipes Scrum e Kanban.
  - role: SysAdmin
    time: Ago 2018 - Ago 2021
    company: Marinha do Brasil, Florianópolis, SC
    details: |
      - Gestão de operações de data center e manutenção de servidores físicos e virtuais com VMware, XenServer e FreeNAS.
      - Administração de ambientes Linux, serviços de domínio, DNS, Samba 4 e aplicações web em Drupal.
      - Manutenção de rotinas de backup, monitoramento e armazenamento com Bacula e Zabbix.
      - Aulas de informática básica para alunos da EAMSC.
  - role: Assistente da Divisão de Sistemas
    time: Dez 2012 - Jan 2018
    company: Marinha do Brasil, Niterói, RJ
    details: |
      - Apoio às operações de data center, incluindo provisionamento e manutenção de servidores, virtualização, backups e monitoramento.
      - Administração de serviços de domínio e DNS, Samba 4 e aplicações web em Drupal em ambientes Linux.
      - Trabalho com VMware ESX, FreeNAS, Bacula, Zabbix, PostgreSQL, MySQL e shell script.
  - role: Analista de Suporte I
    time: Fev 2012 - Jul 2012
    company: Santa Casa de Juiz de Fora, MG
    details: |
      - Suporte a sistemas de faturamento de planos de saúde, elaboração de requisições no Oracle Database (PL/SQL).
      - Atendimento técnico aos usuários e manutenção de computadores.
